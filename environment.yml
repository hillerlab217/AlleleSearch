name: allele_search
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python
  - python=3.12
  - pip
  - setuptools
  - git

  # Core bioinformatics tools
  - blast=2.16.0
  - mafft
  - weblogo=3.7.9

  # Core Python libraries
  - biopython=1.85
  - matplotlib=3.9.4
  - numpy=2.0.2
  - pandas=2.3.1

  # PyMOL (auxiliary visualization scripts)
  - pymol-open-source=3.1.0

  # Java 17+ required by Nextflow
  - conda-forge::openjdk=17

  # nextflow
  - bioconda::nextflow=24.10.2

  # Testing
  - pytest
  - pytest-cov
  - ruff
